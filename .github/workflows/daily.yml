# Daily builds: every push to the daily branch builds a signed APK and publishes it as a GitHub *pre-release*
# named after the next version, e.g. 0.1.27-daily.4 (the number counts up with every daily build).
#
# Pre-releases never reach other people: Eclipse's own updater only asks GitHub for the latest full release, which is
# never a pre-release, and Obtainium skips them unless someone turns that on. Only the last 5 daily builds are kept.
#
# Releasing: when daily has been tested, raise VERSION_NAME in version.properties on daily, merge daily into main and
# push main. release.yml then publishes the real release.
name: Daily build

on:
  push:
    branches: [daily]
  workflow_dispatch:

permissions:
  contents: write

# a newer push stops a daily build that's still running
concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # the RVZ converter (Dolphin's, app/src/main/cpp) is C++: the NDK and CMake versions it builds with
      - name: Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null

      # version.properties holds the last release (0.1.26): a daily build is the next one (0.1.27-daily.<n>).
      # Its version code is the next release's, so it installs over the last release, and the next release
      # installs over it.
      - name: Version
        run: |
          BASE="$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          IFS=. read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
          PATCH=$(( 10#${PATCH:-0} + 1 ))
          VERSION="${MAJOR:-0}.${MINOR:-0}.${PATCH}-daily.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + PATCH ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing (see docs/RELEASING.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Eclipse-$VERSION_NAME.apk"

      - name: Publish the daily build (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Eclipse ${{ env.VERSION_NAME }} (daily)
          body: |
            Daily test build from the `daily` branch (${{ github.sha }}). Not a release: it may have bugs.
            Changes: ${{ github.event.head_commit.message }}
          files: Eclipse-${{ env.VERSION_NAME }}.apk
          prerelease: true
          make_latest: false

      # keep only the 5 newest daily builds (their tags go too)
      - name: Remove old daily builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | contains("-daily."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
