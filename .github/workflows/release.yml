# Builds a signed APK and publishes it as a GitHub release, either
#   - when version.properties changes on main (raise VERSION_NAME and push), or
#   - when a version tag is pushed:  git tag v0.2.0 && git push origin v0.2.0
# Obtainium watches the repository's releases and offers each new APK as an update.
name: Release

on:
  push:
    branches: [main]
    paths: [version.properties]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # the RVZ converter (Dolphin's, app/src/main/cpp) is C++: the NDK and CMake versions it builds with
      - name: Android NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.15729638" "cmake;3.22.1" > /dev/null

      - name: Version (from the tag, else version.properties)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"          # v1.2.3 → 1.2.3 (v1.2.3-beta1 → 1.2.3-beta1)
          else
            VERSION="$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing (see docs/RELEASING.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Eclipse-$VERSION_NAME.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Eclipse ${{ env.VERSION_NAME }}
          files: Eclipse-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION_NAME, '-') }}
