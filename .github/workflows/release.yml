# Builds a signed APK and publishes it as a GitHub release whenever a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# Obtainium watches the repository's releases and offers each new APK as an update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"            # v1.2.3 → 1.2.3 (v1.2.3-beta1 → 1.2.3-beta1)
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing (see docs/RELEASING.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Eclipse-$VERSION_NAME.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Eclipse ${{ env.VERSION_NAME }}
          files: Eclipse-${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
