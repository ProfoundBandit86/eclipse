# Memory: one Gradle JVM with the Kotlin compiler running inside it (instead of a second, separate Kotlin daemon),
# so the build fits on laptops without the system killing it for running out of memory.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
